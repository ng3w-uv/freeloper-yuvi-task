<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AEO Readiness Check</title>
<style>
  :root { color-scheme: light; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 20px; line-height: 1.5; background: #ffffff; color: #1a1a1a; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; color: #1a1a1a; }
  p.sub { color: #666; margin-top: 0; }
  form { display: flex; gap: 8px; margin: 24px 0; }
  input[type="url"] { flex: 1; padding: 10px 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #1a1a1a; }
  button { padding: 10px 18px; font-size: 1rem; border: none; border-radius: 6px; background: #1a7f5a; color: white; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; background: #fff; }
  .status { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-bottom: 6px; }
  .status.observed { background: #d9f2e6; color: #156b47; }
  .status.unavailable { background: #fff3cd; color: #8a6d00; }
  .status.error { background: #fde2e2; color: #a12c2c; }
  pre { background: #f6f6f6; color: #1a1a1a; padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 0.8rem; white-space: pre-wrap; word-break: break-word; }
  #error { color: #a12c2c; }
  #loading { color: #666; }
  .evidence-text { margin: 4px 0 0; font-size: 0.9rem; }
  .evidence-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid #eee; font-size: 0.85rem; }
  .evidence-row:last-child { border-bottom: none; }
  .evidence-key { color: #666; font-weight: 500; flex-shrink: 0; }
  .evidence-value { font-family: ui-monospace, monospace; text-align: right; word-break: break-word; }
  .chip { display: inline-block; background: #eef2ff; color: #33415c; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; margin: 2px 0 2px 4px; }
</style>
</head>
<body>
  <h1>AEO Readiness Check</h1>
  <p class="sub">Submits a URL to a serverless API that checks the homepage and robots.txt.</p>

  <form id="form">
    <input type="url" id="url" required value="https://www.freelopers.com/" />
    <button type="submit" id="submit">Analyze</button>
  </form>

  <div id="loading" hidden>Checking…</div>
  <div id="error" hidden></div>
  <div id="results"></div>

  <script>
    const form = document.getElementById('form');
    const submitBtn = document.getElementById('submit');
    const loading = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const results = document.getElementById('results');

    const LABELS = {
      title_h1: 'Title / H1',
      json_ld: 'JSON-LD',
      robots_txt: 'robots.txt',
    };

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function renderEvidence(evidence) {
      if (typeof evidence === 'string') {
        return `<p class="evidence-text">${escapeHtml(evidence)}</p>`;
      }
      return Object.entries(evidence).map(([key, value]) => {
        if (Array.isArray(value)) {
          const chips = value.map((v) => `<span class="chip">${escapeHtml(v)}</span>`).join('');
          return `<div class="evidence-row"><span class="evidence-key">${escapeHtml(key)}</span><span>${chips || '—'}</span></div>`;
        }
        const text = value === null ? '—' : String(value);
        if (text.length > 60) {
          return `<div><div class="evidence-key">${escapeHtml(key)}</div><pre>${escapeHtml(text)}</pre></div>`;
        }
        return `<div class="evidence-row"><span class="evidence-key">${escapeHtml(key)}</span><span class="evidence-value">${escapeHtml(text)}</span></div>`;
      }).join('');
    }

    function renderFindings(findings) {
      results.innerHTML = '';
      for (const f of findings) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="status ${f.status}">${f.status}</div>
          <h3 style="margin:4px 0">${LABELS[f.id] || f.id}</h3>
          ${renderEvidence(f.evidence)}
        `;
        results.appendChild(card);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('url').value;
      errorEl.hidden = true;
      results.innerHTML = '';
      loading.hidden = false;
      submitBtn.disabled = true;
      try {
        const res = await fetch(`/api/analyze?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'request_failed');
        renderFindings(data.findings);
      } catch (err) {
        errorEl.textContent = `Error: ${err.message}`;
        errorEl.hidden = false;
      } finally {
        loading.hidden = true;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
